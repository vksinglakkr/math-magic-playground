<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Magic Playground | Quick Guide</title>
<style>
:root{--navy:#102d63;--blue:#2459c7;--cyan:#24a8d5;--ink:#172f55;--muted:#60718d;--paper:#f3f7ff;--line:#dce6f7;--white:#fff;--shadow:0 12px 28px rgba(23,53,104,.09)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#eaf2ff 0,#f5f8ff 46%,#eef4fc 100%);font-family:"Noto Sans Devanagari UI","Noto Sans Devanagari",Mangal,Arial,sans-serif;color:var(--ink);line-height:1.55}
header{background:linear-gradient(115deg,#123777 0%,#2459c7 58%,#3c4bd1 100%);color:#fff;padding:30px 18px 27px;text-align:center;box-shadow:0 5px 18px #18396d20}
header h1{margin:0 0 7px;font-size:clamp(1.55rem,4vw,2.45rem);font-weight:800;letter-spacing:-.025em}header p{margin:0;color:#e5edff;font-size:1rem}
main{max-width:1120px;margin:28px auto;padding:0 20px 45px}
#home{background:#ffffffc9;border:1px solid #e2eaf8;border-radius:24px;padding:clamp(16px,3vw,30px);box-shadow:var(--shadow)}
img.overview{display:block;width:100%;height:auto;border-radius:16px;margin-bottom:25px;box-shadow:0 8px 24px #18396d12}
.top-home-wrap{margin:0 0 22px}
.top-home{display:flex;align-items:center;gap:15px;padding:17px 20px;border-radius:20px;text-decoration:none;color:#fff;background:linear-gradient(115deg,#123777 0%,#2459c7 58%,#4a4dd6 100%);box-shadow:0 12px 26px rgba(30,74,157,.22);border:1px solid #ffffff55;transition:transform .18s ease,box-shadow .18s ease}
.top-home:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(30,74,157,.28)}
.top-home-icon{display:grid;place-items:center;flex:0 0 48px;width:48px;height:48px;border-radius:15px;background:#ffffff20;border:1px solid #ffffff55;font-size:25px}
.top-home strong{display:block;color:#fff;font-size:1.08rem;font-weight:800}
.top-home small{display:block;color:#e2ebff;font-size:.86rem;margin-top:2px}
.top-home-arrow{margin-left:auto;font-size:1.5rem;font-weight:800;color:#ffdf70}

.home-infographic-card{margin:0 0 22px;border:1px solid #d6e3f8;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 12px 26px rgba(30,74,157,.12)}
.home-infographic-link{display:block;text-decoration:none;color:inherit}
.home-infographic{display:block;width:100%;height:auto;max-height:300px;object-fit:contain;object-position:center;background:#f5f8ff}
.home-infographic-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:linear-gradient(110deg,#123777,#2459c7 65%,#454bd2);color:#fff}
.home-infographic-cta span{font-weight:800;font-size:1.05rem}.home-infographic-cta strong{font-size:.95rem;color:#ffdf70}
.home-infographic-link:hover .home-infographic-cta{background:linear-gradient(110deg,#0d2d66,#1d4fb8 65%,#353fc5)}
@media(max-width:650px){.home-infographic-cta{align-items:flex-start;flex-direction:column;gap:4px}.home-infographic-cta strong{font-size:.88rem}}

h2{font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:800;margin:25px 0 13px;color:var(--navy);display:flex;align-items:center;gap:10px}
h2:before{content:"";width:5px;height:1.35em;border-radius:5px;background:linear-gradient(var(--cyan),var(--blue));display:inline-block}
.group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
button{font:inherit;cursor:pointer;border:1px solid #d9e4f6;border-radius:17px;background:linear-gradient(145deg,#fff,#f9fbff);color:var(--ink);padding:17px 18px;text-align:left;box-shadow:0 4px 12px #1c42700a;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;display:flex;align-items:center;gap:14px;min-height:88px}
button:hover{transform:translateY(-3px);border-color:#9ebcf4;box-shadow:0 11px 23px #214d941b;background:#fff}
button:focus-visible{outline:3px solid #8bb9ff;outline-offset:3px}
button strong{display:block;font-size:1.03rem;font-weight:800;margin-bottom:3px;color:#153b80}
button span{display:block;font-size:.88rem;color:var(--muted);line-height:1.45}
.group button:before{content:"";flex:0 0 42px;width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#eaf2ff,#dce9ff);box-shadow:inset 0 0 0 1px #d1e1fb;display:block}
.group button[data-img="feature-01-today.png"]:before{content:"☀";display:grid;place-items:center;color:#2258c7;font-size:22px}
.group button[data-img="feature-02-practice.png"]:before{content:"✎";display:grid;place-items:center;color:#187b9c;font-size:22px}
.group button[data-img="feature-03-challenge.png"]:before{content:"★";display:grid;place-items:center;color:#7845c8;font-size:22px}
.group button[data-img="feature-04-library.png"]:before{content:"▤";display:grid;place-items:center;color:#16846f;font-size:21px}
.group button[data-img="feature-05-custom.png"]:before{content:"⚙";display:grid;place-items:center;color:#c17a16;font-size:21px}
.group button[data-img="feature-06-me.png"]:before{content:"◉";display:grid;place-items:center;color:#d65b74;font-size:21px}
.group button[data-img="feature-07-about.png"]:before{content:"i";display:grid;place-items:center;color:#2459c7;font-size:22px;font-weight:900}
.group button[data-img="01-scoring-guide.png"]:before{content:"★";display:grid;place-items:center;color:#bf8a16;font-size:21px;background:linear-gradient(145deg,#fff4d4,#ffe7a1);box-shadow:inset 0 0 0 1px #f4d98c}
.group button[data-img="home.png"]:before{content:"♙";display:grid;place-items:center;color:#2459c7;font-size:21px;background:linear-gradient(145deg,#e5f7ff,#d6edff);box-shadow:inset 0 0 0 1px #bfe5fb}
#detail{margin-top:0;background:#fff;border:1px solid #e0e9f8;border-radius:24px;padding:clamp(14px,3vw,26px);box-shadow:var(--shadow)}#detail[hidden]{display:none}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
.detail-head h2{margin:0}.detail-head h2:before{display:none}
.back{background:linear-gradient(135deg,#1a478e,#2d65d5);color:white;text-align:center;border:0;border-radius:13px;padding:12px 18px;font-weight:700;white-space:nowrap;box-shadow:0 6px 14px #214d9428}
img.detail-img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 8px 24px #18396d12}
footer{text-align:center;padding:24px 12px;color:#657895;font-size:.9rem}
@media(max-width:650px){main{padding:0 12px 30px;margin:16px auto}#home{padding:13px;border-radius:18px}.group{grid-template-columns:1fr;gap:10px}button{padding:14px;min-height:76px}.detail-head{align-items:flex-start;flex-direction:column}.back{width:100%}}
</style></head>
<body>
<header><h1>Math Magic Playground</h1><p>सीखें • अभ्यास करें • अपनी प्रगति देखें</p></header>
<main>
<section id="home">
<div class="top-home-wrap home-infographic-card">
<a class="home-infographic-link" href="https://vksingla.in/mathmagic" target="_blank" rel="noopener noreferrer" aria-label="Math Magic Playground खोलें">
<img class="home-infographic" src="home.png" alt="Math Magic Playground — Home / Main Page infographic">
<span class="home-infographic-cta"><span>🏠 Home / Main Page</span><strong>Click here to open Math Magic Playground ↗</strong></span>
</a></div>
<img class="overview" src="00-overview.png" alt="सात सुविधाओं का सरल परिचय">
<h2>पहले 7 सुविधाओं को समझें</h2>
<div class="group">
<button data-img="feature-01-today.png"><strong>1. Today</strong><span>आज की नई ट्रिक कहाँ मिलेगी?</span></button>
<button data-img="feature-02-practice.png"><strong>2. Practice</strong><span>सीखी हुई ट्रिक का अभ्यास</span></button>
<button data-img="feature-03-challenge.png"><strong>3. Challenge</strong><span>अपनी गति और कौशल आज़माएँ</span></button>
<button data-img="feature-04-library.png"><strong>4. Library</strong><span>पुरानी ट्रिक्स फिर से सीखें</span></button>
<button data-img="feature-05-custom.png"><strong>5. Custom</strong><span>अपनी पसंद के विषय पर अभ्यास</span></button>
<button data-img="feature-06-me.png"><strong>6. Me</strong><span>अपनी प्रगति देखें</span></button>
<button data-img="feature-07-about.png"><strong>7. About</strong><span>इस पहल के बारे में जानें</span></button>
</div>
<h2>स्कोरिंग</h2>
<div class="group">
<button data-img="01-scoring-guide.png"><strong>Scoring Guide</strong><span>अंक मिलने का संक्षिप्त तरीका</span></button>
</div>
</section>
<section id="detail" hidden><div class="detail-head"><h2 id="detailTitle">विस्तृत जानकारी</h2><button class="back" id="backBtn">← मुख्य पेज पर लौटें</button></div><img id="detailImage" class="detail-img" alt="विस्तृत infographic"></section>
</main>
<footer><strong>Digital Saathi • Math Magic Playground</strong><br>सीखें • समझें • आगे बढ़ें<br><a href="https://vksingla.in/mathmagic">vksingla.in/mathmagic</a> • WhatsApp: 9466137300</footer>
<script>
const home=document.getElementById('home'),detail=document.getElementById('detail'),img=document.getElementById('detailImage'),title=document.getElementById('detailTitle');
function openGuideImage(file, label){
 img.src=file; title.textContent=label; home.hidden=true; detail.hidden=false;
 // Add a history entry so browser Back returns to the guide home, not exits the guide.
 history.pushState({guideImage:file,guideTitle:label},'', '#view='+encodeURIComponent(file));
 window.scrollTo({top:0,behavior:'smooth'});
}
function showGuideHome(){
 detail.hidden=true; home.hidden=false; img.removeAttribute('src');
 if(location.hash.startsWith('#view=')) history.replaceState(null,'',location.pathname+location.search);
 window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('popstate',()=>{
 if(detail.hidden) return;
 showGuideHome();
});
document.querySelectorAll('[data-img]').forEach(btn=>btn.addEventListener('click',()=>{
 openGuideImage(btn.dataset.img,btn.querySelector('strong').textContent);
}));
function goHome(){showGuideHome();}
function openScoringFromHash(){
 if(location.hash.toLowerCase()==='#scoring'){
  const scoringButton=document.querySelector('[data-img="01-scoring-guide.png"]');
  if(scoringButton){
   openGuideImage(scoringButton.dataset.img,scoringButton.querySelector('strong').textContent);
  }
 }
}
// Run after the page has fully loaded so direct links such as /guide/#scoring
// reliably open the scoring infographic on first visit and after refresh.
if(document.readyState==='complete'){
 requestAnimationFrame(openScoringFromHash);
}else{
 window.addEventListener('load',()=>requestAnimationFrame(openScoringFromHash),{once:true});
}
window.addEventListener('hashchange',openScoringFromHash);
document.getElementById('backBtn').addEventListener('click',goHome);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!detail.hidden)goHome()});
</script></body></html>
