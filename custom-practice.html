<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom Practice | Math Magic Playground</title>
<style>
:root{--navy:#173b78;--blue:#2563eb;--ink:#172033;--muted:#667085;--line:#dfe6f1;--bg:#f4f7fc;--green:#16834a;--yellow:#f4c542}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.5}.top{background:linear-gradient(125deg,#143b7c,#2865bc);color:white;padding:24px 16px 28px}.topin,.wrap{max-width:1100px;margin:auto}.top h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2.2rem)}.top p{margin:0;opacity:.92}.back{display:inline-block;color:white;margin-bottom:14px;text-decoration:none;border:1px solid #ffffff75;padding:7px 12px;border-radius:10px}.wrap{padding:18px 14px 42px}.panel,.card,.detail{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px #142d5410}.filters{padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}.field label{display:block;font-size:.85rem;font-weight:700;margin-bottom:5px}.field select,.field input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit}.status{padding:10px 14px;color:var(--muted);font-size:.92rem}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:18px 2px 10px;flex-wrap:wrap}.summary h2{font-size:1.1rem;margin:0}.count{color:var(--muted);font-size:.9rem}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{overflow:hidden;display:flex;flex-direction:column}.thumb{height:150px;background:#eef3fb;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:2.4rem}.cardbody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.meta{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.75rem;padding:3px 8px;border-radius:999px;background:#edf3ff;color:#234f9a;font-weight:700}.tag.level1{background:#e7f7ed;color:#167343}.tag.level2{background:#fff5d9;color:#8a5a00}.tag.level3,.tag.level4{background:#ffebeb;color:#a32626}.card h3{margin:0;font-size:1.05rem;line-height:1.35}.desc{font-size:.9rem;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:10px 13px;font-weight:750;font:inherit;cursor:pointer}.btn.secondary{background:#eaf0fb;color:var(--navy)}.card .btn{margin-top:auto}.empty{padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}.detail{display:none;margin-top:18px;padding:18px}.detail.on{display:block}.detailhead{display:flex;justify-content:space-between;align-items:start;gap:12px}.detail h2{margin:0 0 6px}.detailgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:16px}.visual img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}.video{position:relative;width:100%;aspect-ratio:16/9;background:#101828;border-radius:12px;overflow:hidden;margin-top:12px}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.equation{font-size:1.15rem;font-weight:800;background:#f3f7ff;border-radius:10px;padding:12px;margin:12px 0}.steps{padding-left:22px}.steps li{margin:7px 0}.q{border:1px solid var(--line);padding:10px;border-radius:10px;margin:8px 0}.q strong{display:block}.q small{color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.84rem;padding:22px 10px} @media(max-width:800px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.detailgrid{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.thumb{height:190px}.top{padding-top:18px}}
</style></head>
<body>
<header class="top"><div class="topin"><a class="back" href="./index.html">← Back to Math Magic Playground</a><h1>🎯 Custom Practice</h1><p>Choose a topic and difficulty to explore related Math Magic tricks.</p></div></header>
<main class="wrap">
<section class="panel filters" aria-label="Filter tricks">
 <div class="field"><label for="topicFilter">Topic</label><select id="topicFilter"><option value="all">All Topics</option></select></div>
 <div class="field"><label for="levelFilter">Difficulty Level</label><select id="levelFilter"><option value="all">All Levels</option><option value="1">Level 1 — Easy</option><option value="2">Level 2 — Medium</option><option value="3">Level 3 — Hard</option><option value="4">Level 4 — Advanced</option></select></div>
 <div class="field"><label for="searchFilter">Search tricks</label><input id="searchFilter" type="search" placeholder="Search by title…"></div>
</section>
<div class="status" id="status" role="status">Loading tricks from the library…</div>
<div class="summary"><h2>Explore Tricks</h2><span class="count" id="count"></span></div>
<section class="cards" id="cards" aria-live="polite"></section>
<section class="detail" id="detail" aria-live="polite"><div class="detailhead"><div><h2 id="detailTitle"></h2><div class="meta" id="detailMeta"></div></div><button class="btn secondary" id="closeDetail" type="button">Close</button></div><p id="detailIntro"></p><div class="equation" id="equation"></div><div class="detailgrid"><div><h3>Infographic</h3><div class="visual" id="visual"></div><div id="videoWrap"></div></div><div><h3>Steps</h3><ol class="steps" id="steps"></ol><h3>Practice questions</h3><div id="questions"></div><p id="hint"></p></div></div></section>
</main><footer>Math Magic Playground · Digital Saathi · <a href="https://vksingla.in/mathmagic">vksingla.in/mathmagic</a></footer>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwB1mMmqhml2BZJO2rIbokrox8WJmJwYgs5Ies1C-K9g18ElIYfT7hV2g9zNif0P5UsTA/exec';
let tricks=[];
const $=id=>document.getElementById(id);
function val(r,...keys){for(const k of keys){if(r[k]!==undefined&&r[k]!==null&&r[k]!=='')return r[k]}return ''}
function parseArray(v){if(Array.isArray(v))return v;if(typeof v==='string'){try{const x=JSON.parse(v);return Array.isArray(x)?x:[]}catch(e){return []}}return []}
function normalise(r){return {...r,date:val(r,'date','Date'),title:val(r,'title','TrickTitle','trickTitle')||'Untitled trick',intro:val(r,'intro','TrickIntro','trickIntro'),topic:String(val(r,'topic','Topic')).trim(),difficulty:Number(val(r,'difficultyLevel','DifficultyLevel'))||0,imageURL:val(r,'imageURL','ImageURL','imageUrl'),videoURL:val(r,'videoURL','VideoURL'),exampleQuestion:val(r,'exampleQuestion','ExampleQuestion'),exampleAnswer:val(r,'exampleAnswer','ExampleAnswer'),steps:parseArray(val(r,'steps','StepsJSON','stepsJSON')),questions:parseArray(val(r,'questions','PracticeJSON','practiceJSON')),hint:val(r,'hint','Hint'),note:val(r,'note','Note')};}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setStatus(s){$('status').textContent=s}
function levelLabel(n){return ({1:'Level 1 · Easy',2:'Level 2 · Medium',3:'Level 3 · Hard',4:'Level 4 · Advanced'})[n]||'Level not set'}
function populateTopics(){const select=$('topicFilter');const topics=[...new Set(tricks.map(t=>t.topic).filter(Boolean))].sort((a,b)=>a.localeCompare(b));select.replaceChildren(new Option('All Topics','all'));topics.forEach(t=>select.add(new Option(t,t)));}
function renderCards(){const topic=$('topicFilter').value,level=$('levelFilter').value,query=$('searchFilter').value.trim().toLowerCase();const rows=tricks.filter(t=>(topic==='all'||t.topic.toLowerCase()===topic.toLowerCase())&&(level==='all'||String(t.difficulty)===level)&&(!query||t.title.toLowerCase().includes(query)||t.intro.toLowerCase().includes(query))).sort((a,b)=>(a.difficulty||99)-(b.difficulty||99)||String(a.date).localeCompare(String(b.date)));const host=$('cards');host.replaceChildren();$('count').textContent=rows.length+' trick'+(rows.length===1?'':'s');if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent='No matching tricks found. Try another topic or difficulty level.';host.append(d);return}rows.forEach(t=>{const card=document.createElement('article');card.className='card';const thumb=document.createElement('div');thumb.className='thumb';if(t.imageURL){const im=document.createElement('img');im.loading='lazy';im.src=t.imageURL;im.alt=t.title+' infographic';thumb.append(im)}else{const p=document.createElement('span');p.className='placeholder';p.textContent='🧮';thumb.append(p)}const body=document.createElement('div');body.className='cardbody';const meta=document.createElement('div');meta.className='meta';if(t.topic){const a=document.createElement('span');a.className='tag';a.textContent=t.topic;meta.append(a)}if(t.difficulty){const b=document.createElement('span');b.className='tag level'+t.difficulty;b.textContent=levelLabel(t.difficulty);meta.append(b)}const h=document.createElement('h3');h.textContent=t.title;const p=document.createElement('p');p.className='desc';p.textContent=t.intro||'Open this trick to view its explanation and practice questions.';const btn=document.createElement('button');btn.className='btn';btn.textContent='View Trick';btn.type='button';btn.addEventListener('click',()=>showDetail(t));body.append(meta,h,p,btn);card.append(thumb,body);host.append(card)});}
function youtubeEmbed(raw){if(!raw)return '';try{const u=new URL(raw);let id='';if(u.hostname==='youtu.be'||u.hostname==='www.youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';else if(/youtube\.com$/.test(u.hostname)||/youtube-nocookie\.com$/.test(u.hostname)){if(u.pathname==='/watch')id=u.searchParams.get('v')||'';else if(/^\/(embed|shorts)\//.test(u.pathname))id=u.pathname.split('/')[2]||''}if(!/^[\w-]{11}$/.test(id))return '';return 'https://www.youtube-nocookie.com/embed/'+id}catch(e){return ''}}
function showDetail(t){$('detailTitle').textContent=t.title;const meta=$('detailMeta');meta.replaceChildren();[t.topic, t.difficulty?levelLabel(t.difficulty):''].filter(Boolean).forEach(x=>{const s=document.createElement('span');s.className='tag';s.textContent=x;meta.append(s)});$('detailIntro').textContent=t.intro||'';$('equation').textContent=t.exampleQuestion?(t.exampleQuestion+(t.exampleAnswer?' = '+t.exampleAnswer:'')):'';const visual=$('visual');visual.replaceChildren();if(t.imageURL){const img=document.createElement('img');img.src=t.imageURL;img.alt=t.title+' infographic';img.loading='lazy';visual.append(img)}else visual.textContent='No infographic is available for this trick yet.';const vw=$('videoWrap');vw.replaceChildren();const embed=youtubeEmbed(t.videoURL);if(embed){const h=document.createElement('h3');h.textContent='Watch video';const box=document.createElement('div');box.className='video';const frame=document.createElement('iframe');frame.src=embed;frame.title=t.title+' video';frame.loading='lazy';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;box.append(frame);vw.append(h,box)}const steps=$('steps');steps.replaceChildren();t.steps.forEach((s,i)=>{const li=document.createElement('li');const label=s.label||s.title||('Step '+(i+1));li.textContent=label+(s.text||s.explanation?': '+(s.text||s.explanation):'');steps.append(li)});const qs=$('questions');qs.replaceChildren();if(!t.questions.length)qs.textContent='Practice questions will be added soon.';else t.questions.forEach((q,i)=>{const div=document.createElement('div');div.className='q';const strong=document.createElement('strong');strong.textContent=(i+1)+'. '+(q.question||q.Question||q.prompt||'Practice question');div.append(strong);if(q.explanation){const small=document.createElement('small');small.textContent=q.explanation;div.append(small)}qs.append(div)});$('hint').textContent=t.hint||t.note||'';$('detail').classList.add('on');$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
$('topicFilter').addEventListener('change',renderCards);$('levelFilter').addEventListener('change',renderCards);$('searchFilter').addEventListener('input',renderCards);$('closeDetail').addEventListener('click',()=>{$('detail').classList.remove('on');window.scrollTo({top:0,behavior:'smooth'})});
async function init(){try{const response=await fetch(API_URL,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();const rows=Array.isArray(data)?data:(data.tricks||data.data||[]);tricks=rows.map(normalise).filter(t=>{const pub=String(val(t,'published','Published')||'TRUE').trim().toUpperCase();return !['FALSE','NO','0','DRAFT','UNPUBLISHED'].includes(pub)});populateTopics();renderCards();setStatus('Library loaded. Choose a topic and difficulty to filter tricks.');if(!tricks.some(t=>t.topic))setStatus('Library loaded, but no Topic values were found. Fill the Topic column in the Tricks sheet.');}catch(e){console.error(e);setStatus('Could not load the Tricks Library. Check your internet connection and TEST Apps Script deployment.');$('cards').innerHTML='<div class="empty">Tricks are temporarily unavailable. Please refresh the page.</div>'}}
init();
</script></body></html>
