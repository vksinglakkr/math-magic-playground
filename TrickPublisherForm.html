<!doctype html><html><head><base target="_top"><meta charset="utf-8"><style>
body{font:14px Arial,sans-serif;margin:18px;color:#1e293b}h2{margin:0 0 12px}.layout{display:grid;grid-template-columns:37% 63%;gap:16px}.pane{border:1px solid #ddd;border-radius:10px;padding:12px;max-height:610px;overflow:auto}.item{padding:8px;cursor:pointer;border-bottom:1px solid #eee}.item:hover{background:#eff6ff}button{padding:9px 14px;background:#1d4ed8;color:white;border:0;border-radius:7px;cursor:pointer}button:disabled{opacity:.45}input,textarea{width:100%;box-sizing:border-box;padding:7px;border:1px solid #ccc;border-radius:6px}textarea{min-height:65px}label{font-weight:bold;display:block;margin-top:10px;margin-bottom:4px}img{max-width:100%;max-height:250px;object-fit:contain}small,.muted{color:#64748b}.warn{color:#b91c1c;white-space:pre-wrap}.ok{color:#15803d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.crumb{cursor:pointer;color:#1d4ed8}#status{margin:10px 0;min-height:20px}</style></head><body>
<h2>Math Magic — Daily Trick Publisher</h2><div class="layout"><section class="pane"><b>GitHub Infographics</b><p id="crumb"></p><div id="files">Loading…</div></section><section class="pane"><div id="chosen" class="muted">Choose a folder and infographic.</div><div id="image"></div><label>Publish Date (future only)</label><input type="date" id="date"><p><button id="generate" disabled onclick="generate()">Generate AI Draft</button> <button id="check" disabled onclick="check()">Check Duplicate</button></p><div id="status"></div><div id="fields"></div><button id="save" style="display:none" onclick="save()">Save Draft to Tricks</button><p><small>Saved entries use Published = FALSE. Review math answers carefully before publishing.</small></p></section></div>
<script>
let folder='',selected='',draft=null,today='';const $=id=>document.getElementById(id);const names=['TrickTitle','TrickIntro','ExampleQuestion','ExampleAnswer','StepsJSON','Hint','Note','PracticeJSON','BonusQuestion','BonusAnswer','BonusExplanation','VideoURL','DifficultyLevel','PromotionalURL'];
function status(s,cls=''){ $('status').className=cls;$('status').textContent=s; }
function call(fn,args,ok){status('Working…');google.script.run.withSuccessHandler(r=>{status('');ok(r)}).withFailureHandler(e=>status(e.message||String(e),'warn'))[fn](...args)}
call('mmInit',[],r=>{today=r.today;$('date').min=nextDay(today);$('date').value=nextDay(today);browse('')});
function nextDay(s){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}
function browse(path){folder=path;$('crumb').textContent='Root / '+path;call('mmGithub',[path],items=>{$('files').innerHTML='';if(path){const back=document.createElement('div');back.className='item';back.textContent='⬅ Back';back.onclick=()=>browse(path.split('/').slice(0,-1).join('/'));$('files').append(back)}items.forEach(x=>{const el=document.createElement('div');el.className='item';el.textContent=(x.type==='dir'?'📁 ':'🖼️ ')+x.name;el.onclick=()=>x.type==='dir'?browse(x.path):choose(x);$('files').append(el)})})}
function choose(x){selected=x.path;draft=null;$('fields').innerHTML='';$('save').style.display='none';$('chosen').textContent=x.path;$('image').innerHTML='';const im=document.createElement('img');im.src=x.url;im.alt=x.name;$('image').append(im);$('generate').disabled=false;$('check').disabled=false;check()}
function check(){if(!selected)return;call('mmCheck',[selected,$('date').value,''],rows=>{if(rows.length)status('DUPLICATE FOUND:\n'+rows.map(x=>'Row '+x.row+' | '+x.date+' | '+x.title+' | '+x.reasons.join(', ')).join('\n'),'warn');else status('No duplicate image or date found.','ok')})}
$('date').addEventListener('change',()=>{draft=null;$('fields').innerHTML='';$('save').style.display='none';check()});
function generate(){if(!selected||$('date').value<=today)return status('Choose a future date and infographic.','warn');call('mmGenerate',[selected,$('date').value],r=>{draft=r;render(r);status('AI draft ready. Review all answers and explanations.','ok')})}
function render(r){$('fields').innerHTML='';names.forEach(k=>{const label=document.createElement('label');label.textContent=k;const field=document.createElement('textarea');field.id='f_'+k;field.value=r[k]??'';if(['TrickTitle','ExampleQuestion','ExampleAnswer','BonusQuestion','BonusAnswer','DifficultyLevel','VideoURL','PromotionalURL'].includes(k))field.style.minHeight='35px';$('fields').append(label,field)});$('save').style.display='inline-block'}
function save(){if(!draft)return;names.forEach(k=>draft[k]=$('f_'+k).value);draft.Date=$('date').value;draft.Published='FALSE';if(!confirm('Save this entry as an UNPUBLISHED draft?'))return;call('mmSave',[draft],r=>{status('Saved to Tricks row '+r.row+' for '+r.date+'. Published = FALSE.','ok');$('save').style.display='none';draft=null})}
</script></body></html>
